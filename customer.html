<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fast Orders - Customer Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
  <script>window.mqtt || document.write('<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"><\/script>')</script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Silkscreen&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; user-select: none; }
    .dot-matrix { font-family: 'Silkscreen', monospace; letter-spacing: -2px; }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 text-slate-800">

  <div class="max-w-md w-full bg-white rounded-3xl shadow-xl border border-slate-200 overflow-hidden text-center p-6 sm:p-8">
    
    <span class="text-xs bg-orange-100 text-orange-800 font-extrabold px-3 py-1 rounded-full tracking-wider uppercase">The Roastery Cafe</span>
    <p id="conn" class="text-[10px] font-bold mt-2 text-slate-400">● Connecting…</p>
    
    <!-- Order Number Header -->
    <div class="mt-4 mb-2">
      <span class="text-xs font-bold text-slate-400">TRACKING ORDER</span>
      <h1 id="customer-order-num" class="dot-matrix text-6xl font-black text-slate-900 mt-1">---</h1>
    </div>

    <!-- Status Badge -->
    <div id="status-card" class="my-6 p-5 rounded-2xl border-2 transition-all">
      <div id="status-icon" class="text-3xl mb-1">⏳</div>
      <h2 id="status-title" class="font-extrabold text-lg">Connecting...</h2>
      <p id="status-desc" class="text-xs text-slate-500 mt-1">Syncing order status with the cafe counter</p>
    </div>

    <!-- ACTION BUTTONS / FEEDBACK FORM -->
    <div id="action-container" class="space-y-3">
      <!-- Injected dynamically based on state -->
    </div>

  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const myOrderNum = urlParams.get('order');

    if (!myOrderNum) {
      document.getElementById('customer-order-num').innerText = '??';
      document.getElementById('status-card').className = 'my-6 p-5 rounded-2xl border-2 border-red-200 bg-red-50 text-red-900';
      document.getElementById('status-icon').innerText = '❌';
      document.getElementById('status-title').innerText = 'Invalid Order Link';
      document.getElementById('status-desc').innerText = 'Please scan the QR code provided on your cafe receipt.';
    } else {
      document.getElementById('customer-order-num').innerText = `#${myOrderNum}`;
    }

    const BASE_TOPIC = 'fast_orders_channel_2026';
    const $ = id => document.getElementById(id);
    let currentOrderState = null, selectedRating = 5, reviewSubmitted = localStorage.getItem('reviewed_' + new Date().toLocaleDateString('en-CA') + '_' + myOrderNum) === '1', 
    gotData = false, 
    connected = false, 
    client = null;

    function setConn(text, ok) { $('conn').innerText = text; $('conn').className = 'text-[10px] font-bold mt-2 ' + (ok ? 'text-emerald-600' : 'text-red-500'); }
    function showProblem(title, desc) {
      $('status-card').className = 'my-6 p-5 rounded-2xl border-2 border-red-200 bg-red-50 text-red-900';
      $('status-icon').innerText = '⚠️'; $('status-title').innerText = title; $('status-desc').innerText = desc;
    }

    if (typeof mqtt === 'undefined') {
      setConn('● Not connected', false);
      showProblem('Live updates could not load', 'Check your internet connection, then reload this page.');
    } else {
      client = mqtt.connect('wss://broker.emqx.io:8084/mqtt', { reconnectPeriod: 2000, connectTimeout: 10000 });
      client.on('connect', () => {
        connected = true; setConn('● Live', true);
        client.subscribe(`${BASE_TOPIC}/orders`);
        client.subscribe(`${BASE_TOPIC}/events`);
      });
      client.on('close', () => { connected = false; setConn('● Reconnecting…', false); });
      client.on('error', () => setConn('● Reconnecting…', false));
    }

    // After 8 seconds, say what is wrong instead of staying on "Connecting..." forever
    setTimeout(() => {
      if (gotData || !myOrderNum) return;
      if (!connected) showProblem("Can't reach the live server", 'Try Wi-Fi or mobile data, then reload. We keep retrying automatically.');
      else { $('status-title').innerText = 'Waiting for the cafe system'; $('status-desc').innerText = 'Your order is not showing yet. The cashier screen may be offline. This page updates by itself.'; }
    }, 8000);

    if (client) client.on('message', (topic, message) => {
      try {
        const data = JSON.parse(message.toString());
                // The cashier pressed the bell again: ring again
        if (topic.endsWith('/events') && data.type === 'ring' && String(data.number) === String(myOrderNum)) { acked = false; if (currentOrderState) updateUI(currentOrderState); }
        if (topic.endsWith('/orders') && data.orders && myOrderNum) {
          gotData = true;
          const found = data.orders.find(o => String(o.number) === String(myOrderNum));
          if (found) {
            currentOrderState = found;
            updateUI(found);
          } else if (!currentOrderState) {
            showProblem('Order not found', 'We cannot find this order. Make sure the QR code is from your latest receipt.');
          }
        }
      } catch (e) {}
    });
        // ---------- Sound alert ----------
    let audioCtx = null, soundOn = false, ringTimer = null, acked = false, wakeLock = null;

    function beepOnce() {
      if (audioCtx) [0, 0.25].forEach(t => {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain(), s = audioCtx.currentTime + t;
        o.type = 'sine'; o.frequency.value = t ? 1175 : 880; o.connect(g); g.connect(audioCtx.destination);
        g.gain.setValueAtTime(0.0001, s); g.gain.exponentialRampToValueAtTime(0.6, s + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, s + 0.22);
        o.start(s); o.stop(s + 0.25);
      });
      if (navigator.vibrate) navigator.vibrate([300, 150, 300]);
    }
    function startRinging() { if (ringTimer || !soundOn) return; beepOnce(); let n = 0; ringTimer = setInterval(() => { beepOnce(); if (++n > 80) stopRinging(); }, 1600); }
    function stopRinging() { clearInterval(ringTimer); ringTimer = null; }
    async function getWakeLock() {
      try { if (navigator.wakeLock && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch (e) {}
    }
    async function enableSound() {
      try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); await audioCtx.resume(); soundOn = true; beepOnce(); } catch (e) {}
      getWakeLock();
      if (currentOrderState) updateUI(currentOrderState); else document.getElementById('action-container').innerHTML = soundButton();
    }
    function soundButton() {
      return soundOn
        ? '<p class="text-xs font-bold text-emerald-700 bg-emerald-50 border border-emerald-200 rounded-xl p-3">🔊 Sound alert is on. Keep this page open and your screen on.</p>'
        : '<button onclick="enableSound()" class="w-full py-3.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-extrabold text-xs transition shadow-md">🔔 Enable sound notifications</button><p class="text-[11px] text-slate-400 mt-2">Tap once so your phone can ring when the order is ready.</p>';
    }

    function updateUI(order) {
      const card = document.getElementById('status-card');
      const icon = document.getElementById('status-icon');
      const title = document.getElementById('status-title');
      const desc = document.getElementById('status-desc');
      const actions = document.getElementById('action-container');

      if (order.status === 'preparing') {
        card.className = 'my-6 p-5 rounded-2xl border-2 border-amber-200 bg-amber-50 text-amber-950';
        icon.innerText = '👨‍🍳';
        title.innerText = 'Preparing Your Order';
        desc.innerText = order.desc || 'Your order is currently being prepared at the bar.';
        stopRinging();
        actions.innerHTML = soundButton();
      } 
      else if (order.status === 'ready') {
        card.className = 'my-6 p-5 rounded-2xl border-2 border-emerald-300 bg-emerald-100 text-emerald-950 animate-pulse';
        icon.innerText = '🔔';
        title.innerText = 'Order is Ready!';
        desc.innerText = 'Please head to the counter to pick up your items.';
        
        const ringNow = order.ringing && !order.customerComing && !acked;
        actions.innerHTML = (soundOn ? '' : soundButton() + '<div class="h-1"></div>') + (order.customerComing
          ? '<p class="text-xs font-bold text-emerald-800 bg-emerald-50 border border-emerald-200 rounded-xl p-3">✓ The cashier knows you are on your way</p>'
          : `<button onclick="notifyComing()" class="w-full py-3.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-xs transition shadow-lg">🏃‍♂️ I'm on my way to the counter!</button>`);
        if (ringNow) startRinging(); else stopRinging();
      } 
      else if (order.status === 'picked_up') {
        setCompletedUI();
      }
    }

    function setCompletedUI() {
            stopRinging();
      const card = document.getElementById('status-card');
      const icon = document.getElementById('status-icon');
      const title = document.getElementById('status-title');
      const desc = document.getElementById('status-desc');
      const actions = document.getElementById('action-container');

      card.className = 'my-6 p-5 rounded-2xl border-2 border-slate-200 bg-slate-50 text-slate-800';
      icon.innerText = '✅';
      title.innerText = 'Order Picked Up';
      desc.innerText = 'Thank you for visiting The Roastery!';

      if (reviewSubmitted) {
        actions.innerHTML = `
          <div class="bg-emerald-50 border border-emerald-200 p-4 rounded-2xl text-emerald-900 text-xs font-bold">
            ❤️ Thank you! Your feedback has been sent to the manager.
          </div>
        `;
      } else {
        actions.innerHTML = `
          <div class="border-t border-slate-200 pt-4 text-left">
            <h3 class="font-extrabold text-xs text-slate-900 mb-1 text-center">How was your experience?</h3>
            <p class="text-[11px] text-slate-500 mb-3 text-center">Rate us and let us know what we can improve:</p>
            
            <!-- Star Rating Selector -->
            <div id="star-container" class="flex justify-center gap-2 mb-3">
              <button type="button" onclick="setRating(1)" class="text-2xl text-slate-300 hover:scale-110 transition star-btn" data-val="1">★</button>
              <button type="button" onclick="setRating(2)" class="text-2xl text-slate-300 hover:scale-110 transition star-btn" data-val="2">★</button>
              <button type="button" onclick="setRating(3)" class="text-2xl text-slate-300 hover:scale-110 transition star-btn" data-val="3">★</button>
              <button type="button" onclick="setRating(4)" class="text-2xl text-slate-300 hover:scale-110 transition star-btn" data-val="4">★</button>
              <button type="button" onclick="setRating(5)" class="text-2xl text-amber-400 hover:scale-110 transition star-btn" data-val="5">★</button>
            </div>

            <textarea id="review-comment" rows="2" placeholder="What can we improve? (optional)..." class="w-full border-2 border-slate-200 rounded-xl p-2.5 text-xs font-medium focus:outline-none focus:border-orange-500 mb-2"></textarea>
            
            <button onclick="submitReview()" class="w-full py-3 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs transition shadow-md">
              Submit Feedback 🚀
            </button>
          </div>
        `;
        setRating(5); // Initialize stars
      }
    }

    function setRating(val) {
      selectedRating = val;
      const buttons = document.querySelectorAll('.star-btn');
      buttons.forEach(btn => {
        const starVal = parseInt(btn.getAttribute('data-val'));
        if (starVal <= val) {
          btn.className = 'text-2xl text-amber-400 hover:scale-110 transition star-btn';
        } else {
          btn.className = 'text-2xl text-slate-300 hover:scale-110 transition star-btn';
        }
      });
    }

    function submitReview() {
      const comment = document.getElementById('review-comment').value.trim();
      const order = currentOrderState || {};
      const reviewObj = {
        orderNum: myOrderNum,
        rating: selectedRating,
        comment: comment,
        items: Array.isArray(order.items) ? order.items.map(item => ({
          name: item.name || 'Item',
          qty: Number(item.qty) || 1,
          price: Number(item.price) || 0
        })) : [],
        total: Number(order.total) || 0,
        timestamp: Date.now()
      };

      if (!client) return alert('Not connected yet. Please try again in a moment.');
      // One retained topic per order lets the manager receive multiple reviews after reconnecting.
      client.publish(`${BASE_TOPIC}/reviews/${encodeURIComponent(String(myOrderNum))}`, JSON.stringify({ review: reviewObj }), { retain: true });
      reviewSubmitted = true;
            localStorage.setItem('reviewed_' + new Date().toLocaleDateString('en-CA') + '_' + myOrderNum, '1');
      setCompletedUI();
    }

    function notifyComing() {
            acked = true; stopRinging();
      if (!client) return alert('Not connected yet. Please try again in a moment.');
      client.publish(`${BASE_TOPIC}/events`, JSON.stringify({ type: 'coming', number: myOrderNum }), { retain: false });
      alert('The cashier has been notified that you are heading to the counter!');
    }
        if (myOrderNum) document.getElementById('action-container').innerHTML = soundButton();
    document.addEventListener('visibilitychange', () => { if (!document.hidden && soundOn) getWakeLock(); });
  </script>
</body>
</html>
