<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script><script src="config.js"></script><title>Manager</title></head>
<body class="bg-slate-100 p-4 text-slate-800">
<div id="login" class="hidden max-w-sm mx-auto mt-16 bg-white rounded-3xl p-6 shadow-xl space-y-3">
  <h1 class="font-black text-lg">Manager sign in</h1>
  <input id="em" type="email" placeholder="Email" class="w-full border-2 rounded-xl p-2.5 text-sm"><input id="pw" type="password" placeholder="Password" class="w-full border-2 rounded-xl p-2.5 text-sm">
  <button onclick="login()" class="w-full py-3 rounded-xl bg-orange-500 text-white font-bold text-sm">Sign in</button><p id="err" class="text-xs text-red-600"></p>
</div>
<div id="app" class="hidden max-w-3xl mx-auto space-y-4">
  <div class="flex justify-between items-center"><h1 class="font-black text-xl">Manager</h1><button onclick="sb.auth.signOut().then(()=>location.reload())" class="text-xs font-bold text-red-600">Sign out</button></div>
  <section class="bg-white rounded-2xl p-4 shadow"><h2 class="font-extrabold mb-2">Menu</h2>
    <div class="flex gap-2 mb-3"><input id="n" placeholder="Item name" class="flex-1 border-2 rounded-xl p-2 text-xs"><input id="p" type="number" step="0.01" min="0" placeholder="Price" class="w-24 border-2 rounded-xl p-2 text-xs"><button onclick="addItem()" class="bg-orange-500 text-white text-xs font-bold px-3 rounded-xl">Add</button></div><div id="menu" class="space-y-2"></div></section>
  <section class="bg-white rounded-2xl p-4 shadow"><h2 class="font-extrabold mb-2">This month</h2><div id="stats" class="text-xs space-y-1"></div></section>
  <section class="bg-white rounded-2xl p-4 shadow"><h2 class="font-extrabold mb-2">Customer reviews</h2><div id="reviews" class="text-xs space-y-2"></div></section>
  <section class="bg-white rounded-2xl p-4 shadow"><h2 class="font-extrabold mb-2">Change my password</h2><div class="flex gap-2"><input id="np" type="password" placeholder="New password (8+ characters)" class="flex-1 border-2 rounded-xl p-2 text-xs"><button onclick="changePw()" class="bg-slate-900 text-white text-xs font-bold px-3 rounded-xl">Change</button></div></section>
</div>
<script>
const sb = supabase.createClient(CONFIG.url, CONFIG.key), CUR = CONFIG.cur, $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let names = {};
async function login() { const { error } = await sb.auth.signInWithPassword({ email: $('em').value, password: $('pw').value }); error ? $('err').innerText = error.message : start(); }
async function start() {
  const { data: p } = await sb.from('profiles').select('role').maybeSingle();
  if (!p || p.role !== 'manager') { sb.auth.signOut(); $('login').classList.remove('hidden'); return ($('err').innerText = 'Manager access only.'); }
  $('login').classList.add('hidden'); $('app').classList.remove('hidden'); load();
}
async function load() {
  const first = new Date(new Date().getFullYear(), new Date().getMonth(), 1).toLocaleDateString('en-CA');
  const [m, o, r] = await Promise.all([sb.from('menu').select().order('id'), sb.from('orders').select('items,total,created_at').eq('status', 'picked_up').gte('day', first),
    sb.from('reviews').select().order('created_at', { ascending: false }).limit(100)]);
  const menu = m.data || [], ord = o.data || [], rv = r.data || []; names = Object.fromEntries(menu.map(i => [i.id, i.name]));
  $('menu').innerHTML = menu.map(i => `<div class="flex items-center gap-2 bg-slate-50 rounded-xl p-2"><span class="flex-1 text-xs font-bold truncate">${esc(i.name)}</span><input id="pr${i.id}" type="number" step="0.01" min="0" value="${i.price.toFixed(2)}" class="w-20 border-2 rounded-lg p-1 text-xs"><button onclick="save(${i.id})" class="text-xs font-bold bg-orange-100 text-orange-800 px-2 py-1 rounded-lg">Save</button><button onclick="del(${i.id})" class="text-xs font-bold text-red-600">Delete</button></div>`).join('');
  const rev = ord.reduce((s, x) => s + x.total, 0), prod = {}, hrs = Array(24).fill(0);
  ord.forEach(x => { hrs[new Date(x.created_at).getHours()] += x.total; x.items.forEach(i => { const p = prod[i.name] = prod[i.name] || [0, 0]; p[0] += i.qty; p[1] += i.qty * i.price; }); });
  const top = Object.entries(prod).sort((a, b) => b[1][0] - a[1][0]).slice(0, 8), busy = hrs.map((v, h) => [h, v]).filter(x => x[1] > 0).sort((a, b) => b[1] - a[1]).slice(0, 3);
  $('stats').innerHTML = `<p>Revenue <b>${CUR}${rev.toFixed(2)}</b> · Orders <b>${ord.length}</b> · Average <b>${CUR}${(ord.length ? rev / ord.length : 0).toFixed(2)}</b></p>` +
    (top.length ? '<p class="font-bold mt-2">Best sellers</p>' + top.map(([n, [q, v]]) => `<p>${esc(n)}: ${q} sold (${CUR}${v.toFixed(2)})</p>`).join('') : '<p class="italic text-slate-400">No sales yet this month</p>') +
    (busy.length ? '<p class="font-bold mt-2">Busiest hours</p>' + busy.map(h => `<p>${h[0]}:00 – ${CUR}${h[1].toFixed(2)}</p>`).join('') : '');
  $('reviews').innerHTML = rv.map(x => `<div class="bg-slate-50 rounded-xl p-2"><b>#${x.number}</b> <span class="text-amber-500">${'★'.repeat(x.rating)}${'☆'.repeat(5 - x.rating)}</span> <span class="text-slate-400">${esc(x.day)}</span><p>${esc(x.comment || '') || '<i class="text-slate-400">No comment</i>'}</p></div>`).join('') || '<p class="italic text-slate-400">No reviews yet</p>';
}
const run = async q => { const { error } = await q; error ? alert(error.message) : load(); };
const addItem = async () => { await run(sb.from('menu').insert({ name: $('n').value.trim(), price: parseFloat($('p').value) })); $('n').value = $('p').value = ''; };
const save = id => run(sb.from('menu').update({ price: parseFloat($('pr' + id).value) }).eq('id', id));
const del = id => confirm('Delete this item?') && run(sb.from('menu').delete().eq('id', id));
const changePw = async () => { const { error } = await sb.auth.updateUser({ password: $('np').value }); error ? alert(error.message) : (alert('Password changed.'), $('np').value = ''); };
sb.auth.getSession().then(({ data }) => data.session ? start() : $('login').classList.remove('hidden'));
</script></body></html>
